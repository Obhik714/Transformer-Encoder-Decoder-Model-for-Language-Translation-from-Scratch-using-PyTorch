[project]
name = "language-translation-model-from-scratch"
version = "0.1.0"
description = "Using pytorch to create a custom encoder decoder model to use for english to spanish translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "torch",
    "numpy",
    "matplotlib",
    "math",
    "pandas",
    "datasets",
    "transformers",
    "datetime"
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0"
]
